<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#080808" />
<title>Ajanta–Ellora International Film Festival — 11th Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#080808;
    --bg-1:#0a0a0a;
    --bg-2:#121212;
    --warm:#f5f2ec;
    --muted:#a3a3a3;
    --red:#b21f2d;
    --red-deep:#70121a;
    --gold:#c8a96b;
    --serif:'Cormorant Garamond', serif;
    --sans:'Manrope', sans-serif;
    --ease-out: cubic-bezier(.16,1,.3,1);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg-0);
    color:var(--warm);
    font-family:var(--sans);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  ::selection{ background:var(--red-deep); color:var(--warm); }

  :focus-visible{ outline:1px solid var(--gold); outline-offset:4px; }

  /* ---------- film grain ---------- */
  .grain{
    position:fixed; inset:-10%;
    width:120%; height:120%;
    pointer-events:none;
    z-index:60;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grainShift 1.1s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{ transform:translate(0,0); }
    25%{ transform:translate(-1%,1%); }
    50%{ transform:translate(1%,-1%); }
    75%{ transform:translate(-1%,-1%); }
    100%{ transform:translate(0,0); }
  }

  /* ---------- custom cursor (desktop only, JS-gated) ---------- */
  .cursor-dot,.cursor-ring{
    position:fixed; top:0; left:0;
    pointer-events:none; z-index:80;
    border-radius:50%;
    transform:translate(-50%,-50%);
    opacity:0;
    transition:opacity .3s ease;
  }
  .cursor-dot{ width:5px; height:5px; background:var(--warm); }
  .cursor-ring{ width:34px; height:34px; border:1px solid rgba(245,242,236,.45); transition:opacity .3s ease, width .25s var(--ease-out), height .25s var(--ease-out), border-color .25s ease; }
  html.custom-cursor-active .cursor-dot,
  html.custom-cursor-active .cursor-ring{ opacity:1; }
  html.custom-cursor-active,
  html.custom-cursor-active a,
  html.custom-cursor-active button{ cursor:none; }
  .cursor-ring.is-active{ width:56px; height:56px; border-color:var(--gold); }

  /* ================= HEADER ================= */
  .site-header{
    position:fixed; top:0; left:0; right:0;
    z-index:50;
    padding-top:14px;
    transition:padding .5s var(--ease-out);
  }
  .header-inner{
    max-width:1360px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 40px;
    border-bottom:1px solid transparent;
    transition:background .5s var(--ease-out), backdrop-filter .5s var(--ease-out), border-color .5s var(--ease-out), padding .5s var(--ease-out);
  }
  .site-header.is-scrolled{ padding-top:0; }
  .site-header.is-scrolled .header-inner{
    background:rgba(8,8,8,.72);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid rgba(245,242,236,.08);
    padding:14px 40px;
  }

  .logo{
    font-family:var(--serif);
    font-size:1.5rem;
    letter-spacing:.06em;
    font-weight:600;
    color:var(--warm);
  }

  .main-nav{ display:flex; align-items:center; gap:36px; }
  .main-nav a{
    position:relative;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:rgba(245,242,236,.82);
    padding-bottom:4px;
  }
  .main-nav a::after{
    content:'';
    position:absolute; left:0; bottom:0;
    width:100%; height:1px;
    background:var(--gold);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .35s var(--ease-out);
  }
  .main-nav a:hover{ color:var(--warm); }
  .main-nav a:hover::after{ transform:scaleX(1); }

  .header-right{ display:flex; align-items:center; gap:28px; }

  .btn-register{
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.16em;
    padding:11px 24px;
    border:1px solid rgba(245,242,236,.4);
    transition:background .35s ease, border-color .35s ease, color .35s ease;
    white-space:nowrap;
  }
  .btn-register:hover{
    background:var(--red-deep);
    border-color:var(--red-deep);
    color:var(--warm);
  }

  .nav-toggle{
    display:none;
    width:34px; height:24px;
    position:relative;
    background:none; border:none;
    cursor:pointer;
    padding:0;
  }
  .nav-toggle span,
  .nav-toggle span::before,
  .nav-toggle span::after{
    content:'';
    position:absolute; left:0;
    width:100%; height:1px;
    background:var(--warm);
    transition:transform .3s ease, opacity .3s ease, top .3s ease;
  }
  .nav-toggle span{ top:11px; }
  .nav-toggle span::before{ top:-8px; }
  .nav-toggle span::after{ top:8px; }
  .nav-toggle.is-open span{ background:transparent; }
  .nav-toggle.is-open span::before{ top:0; transform:rotate(45deg); }
  .nav-toggle.is-open span::after{ top:0; transform:rotate(-45deg); }

  .mobile-menu{
    position:fixed; inset:0;
    background:rgba(8,8,8,.98);
    z-index:45;
    display:flex; flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    gap:22px;
    padding:40px;
    opacity:0; visibility:hidden;
    transform:translateY(-12px);
    transition:opacity .4s var(--ease-out), transform .4s var(--ease-out), visibility 0s linear .4s;
  }
  .mobile-menu.is-open{
    opacity:1; visibility:visible; transform:translateY(0);
    transition:opacity .4s var(--ease-out), transform .4s var(--ease-out);
  }
  .mobile-menu a{
    font-family:var(--serif);
    font-size:2.1rem;
    letter-spacing:.02em;
    color:var(--warm);
  }
  .mobile-menu .btn-register{ margin-top:16px; }

  /* ================= HERO ================= */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
    background:var(--bg-0);
  }

  .hero-bg{
    position:absolute; inset:0;
    animation:bgScale 11s var(--ease-out) forwards;
    transform-origin:center;
  }
  @keyframes bgScale{
    from{ transform:scale(1.06); }
    to{ transform:scale(1); }
  }

  .arch-portal{
    position:absolute;
    left:50%; top:46%;
    width:min(64vw, 900px);
    height:min(82vh, 860px);
    transform:translate(-50%,-50%);
    border-radius:50% 50% 6% 6% / 34% 34% 6% 6%;
    background:radial-gradient(ellipse at 50% 28%, rgba(200,169,107,.16) 0%, rgba(178,31,45,.09) 42%, rgba(8,8,8,0) 72%);
    border:1px solid rgba(200,169,107,.14);
    filter:blur(1px);
  }

  .light-beam{
    position:absolute;
    left:50%; top:-8%;
    width:42vw;
    height:110%;
    transform:translateX(-50%);
    background:linear-gradient(to bottom, rgba(245,242,236,.14), rgba(245,242,236,0) 68%);
    clip-path:polygon(48.5% 0%, 51.5% 0%, 84% 100%, 16% 100%);
    mix-blend-mode:screen;
    filter:blur(26px);
    opacity:.55;
  }

  .filmstrip{
    position:absolute; top:0; bottom:0; width:5px;
    background-image:repeating-linear-gradient(to bottom, rgba(245,242,236,.22) 0 10px, transparent 10px 22px);
    opacity:.35;
  }
  .filmstrip.left{ left:22px; }
  .filmstrip.right{ right:22px; }

  .pillar-lines{
    position:absolute; top:0; bottom:0; width:16vw;
    opacity:.045;
    background-image:repeating-linear-gradient(to right, var(--warm) 0 1px, transparent 1px 30px);
  }
  .pillar-lines.left{ left:0; }
  .pillar-lines.right{ right:0; }

  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 62%, rgba(8,8,8,0) 0%, rgba(8,8,8,.5) 72%, rgba(8,8,8,.92) 100%),
      linear-gradient(to bottom, rgba(8,8,8,.35) 0%, rgba(8,8,8,0) 30%, rgba(8,8,8,0) 62%, rgba(8,8,8,.95) 100%);
  }

  .hero-content{
    position:relative;
    z-index:3;
    width:100%;
    max-width:1360px;
    margin:0 auto;
    padding:0 40px 108px;
  }

  .hero-eyebrow{
    display:flex; align-items:center; gap:14px;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:.32em;
    color:var(--gold);
    margin:0 0 26px;
    opacity:0;
    animation:fadeIn .9s var(--ease-out) .15s forwards;
  }
  .hero-eyebrow::before{
    content:'';
    display:block;
    width:28px; height:1px;
    background:var(--gold);
  }

  .hero-title{
    margin:0 0 34px;
    font-family:var(--serif);
    font-weight:500;
    font-size:clamp(2.9rem, 8.6vw, 7.8rem);
    line-height:.96;
    letter-spacing:-.01em;
    color:var(--warm);
  }
  .hero-title-line{ display:block; overflow:hidden; }
  .hero-title-line span{
    display:block;
    transform:translateY(112%);
    animation:revealUp 1.15s var(--ease-out) forwards;
  }
  .hero-title-line:nth-child(1) span{ animation-delay:.45s; }
  .hero-title-line:nth-child(2) span{ animation-delay:.62s; }
  .hero-title-line:nth-child(3) span{ animation-delay:.79s; }

  .hero-meta{
    font-size:clamp(.85rem, 1vw, 1rem);
    text-transform:uppercase;
    letter-spacing:.14em;
    line-height:1.9;
    color:rgba(245,242,236,.78);
    margin:0 0 46px;
    opacity:0;
    animation:fadeUp .9s var(--ease-out) 1.05s forwards;
  }
  .hero-meta em{
    font-style:normal;
    color:var(--muted);
  }

  .hero-cta{
    display:flex; align-items:center; gap:36px; flex-wrap:wrap;
    opacity:0;
    animation:fadeUp .9s var(--ease-out) 1.28s forwards;
  }

  .btn-primary{
    position:relative;
    display:inline-flex; align-items:center; gap:14px;
    padding:18px 34px;
    border:1px solid rgba(245,242,236,.4);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.18em;
    transition:background .4s ease, border-color .4s ease;
  }
  .btn-primary svg{ width:16px; height:11px; transition:transform .4s var(--ease-out); }
  .btn-primary:hover{ background:rgba(245,242,236,.06); border-color:var(--gold); }
  .btn-primary:hover svg{ transform:translateX(6px); }

  .btn-secondary{
    position:relative;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.18em;
    padding-bottom:6px;
  }
  .btn-secondary::after{
    content:'';
    position:absolute; left:0; bottom:0;
    width:100%; height:1px;
    background:var(--red);
    transform:scaleX(.28);
    transform-origin:left;
    transition:transform .4s var(--ease-out);
  }
  .btn-secondary:hover::after{ transform:scaleX(1); }

  .scroll-indicator{
    position:absolute;
    right:40px; bottom:44px;
    z-index:3;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    opacity:0;
    animation:fadeIn 1s var(--ease-out) 1.9s forwards;
  }
  .scroll-indicator span{
    writing-mode:vertical-rl;
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:.28em;
    color:var(--muted);
  }
  .scroll-track{
    width:1px; height:52px;
    background:rgba(245,242,236,.18);
    position:relative;
    overflow:hidden;
  }
  .scroll-track::after{
    content:'';
    position:absolute; left:0; top:-52px;
    width:100%; height:52px;
    background:linear-gradient(to bottom, transparent, var(--gold));
    animation:scrollDrop 2.6s ease-in-out infinite;
  }

  @keyframes revealUp{ to{ transform:translateY(0); } }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes scrollDrop{
    0%{ top:-52px; }
    60%{ top:52px; }
    100%{ top:52px; }
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width:900px){
    .main-nav{ display:none; }
    .header-right .btn-register{ display:none; }
    .nav-toggle{ display:block; }
    .header-inner{ padding:18px 24px; }
    .site-header.is-scrolled .header-inner{ padding:14px 24px; }
    .hero-content{ padding:0 24px 76px; }
    .pillar-lines{ display:none; }
    .filmstrip{ display:none; }
    .arch-portal{ width:88vw; height:70vh; top:44%; }
    .scroll-indicator{ right:24px; bottom:28px; }
  }

  @media (max-width:520px){
    .hero-cta{ flex-direction:column; align-items:flex-start; gap:20px; }
    .btn-primary{ width:100%; justify-content:space-between; }
  }

  @media (prefers-reduced-motion:reduce){
    .grain{ animation:none; }
    .hero-bg{ animation:none; transform:none; }
    .hero-title-line span{ animation:none; transform:none; opacity:1; }
    .hero-eyebrow,.hero-meta,.hero-cta,.scroll-indicator{ animation:none; opacity:1; }
    .scroll-track::after{ animation:none; }
    .cursor-dot,.cursor-ring{ display:none; }
  }
</style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="logo" href="#hero">AIFF</a>

      <nav class="main-nav" aria-label="Primary">
        <a href="#festival">Festival</a>
        <a href="#films">Films</a>
        <a href="#programme">Programme</a>
        <a href="#awards">Awards</a>
        <a href="#jury">Jury</a>
        <a href="#workshops">Workshops</a>
        <a href="#about">About</a>
      </nav>

      <div class="header-right">
        <a class="btn-register" href="#register">Register</a>
        <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
          <span></span>
        </button>
      </div>
    </div>

    <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">
      <a href="#festival">Festival</a>
      <a href="#films">Films</a>
      <a href="#programme">Programme</a>
      <a href="#awards">Awards</a>
      <a href="#jury">Jury</a>
      <a href="#workshops">Workshops</a>
      <a href="#about">About</a>
      <a class="btn-register" href="#register">Register</a>
    </nav>
  </header>

  <section class="hero" id="hero">
    <div class="hero-bg" aria-hidden="true">
      <div class="pillar-lines left"></div>
      <div class="pillar-lines right"></div>
      <div class="arch-portal"></div>
      <div class="light-beam"></div>
      <div class="filmstrip left"></div>
      <div class="filmstrip right"></div>
      <div class="vignette"></div>
    </div>

    <div class="hero-content">
      <p class="hero-eyebrow">11th Edition</p>

      <h1 class="hero-title">
        <span class="hero-title-line"><span>Ajanta–Ellora</span></span>
        <span class="hero-title-line"><span>International</span></span>
        <span class="hero-title-line"><span>Film Festival</span></span>
      </h1>

      <p class="hero-meta">12 &mdash; 16 November 2026<br /><em>Chhatrapati Sambhajinagar, Maharashtra</em></p>

      <div class="hero-cta">
        <a href="#festival" class="btn-primary" id="magneticBtn">
          <span>Explore Festival</span>
          <svg viewBox="0 0 16 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 5.5H15M15 5.5L10.5 1M15 5.5L10.5 10" stroke="currentColor" stroke-width="1"/></svg>
        </a>
        <a href="#register" class="btn-secondary">Register</a>
      </div>
    </div>

    <div class="scroll-indicator" aria-hidden="true">
      <span>Scroll to Explore</span>
      <div class="scroll-track"></div>
    </div>
  </section>

<script>
  // header scroll state
  const header = document.getElementById('siteHeader');
  const onScroll = () => {
    if(window.scrollY > 40){ header.classList.add('is-scrolled'); }
    else{ header.classList.remove('is-scrolled'); }
  };
  document.addEventListener('scroll', onScroll, { passive:true });
  onScroll();

  // mobile menu
  const navToggle = document.getElementById('navToggle');
  const mobileMenu = document.getElementById('mobileMenu');
  navToggle.addEventListener('click', () => {
    const open = mobileMenu.classList.toggle('is-open');
    navToggle.classList.toggle('is-open', open);
    navToggle.setAttribute('aria-expanded', open);
  });
  mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    mobileMenu.classList.remove('is-open');
    navToggle.classList.remove('is-open');
    navToggle.setAttribute('aria-expanded', 'false');
  }));

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fineCursor = window.matchMedia('(pointer: fine)').matches;

  // custom cursor
  if(fineCursor && !reduceMotion){
    document.documentElement.classList.add('custom-cursor-active');
    const dot = document.querySelector('.cursor-dot');
    const ring = document.querySelector('.cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.left = mx + 'px'; dot.style.top = my + 'px';
    });
    const lerp = () => {
      rx += (mx - rx) * 0.16;
      ry += (my - ry) * 0.16;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(lerp);
    };
    lerp();
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => ring.classList.add('is-active'));
      el.addEventListener('mouseleave', () => ring.classList.remove('is-active'));
    });
  }

  // magnetic button
  const magneticBtn = document.getElementById('magneticBtn');
  if(fineCursor && !reduceMotion && magneticBtn){
    magneticBtn.addEventListener('mousemove', e => {
      const r = magneticBtn.getBoundingClientRect();
      const x = e.clientX - r.left - r.width / 2;
      const y = e.clientY - r.top - r.height / 2;
      magneticBtn.style.transform = `translate(${x * 0.24}px, ${y * 0.32}px)`;
    });
    magneticBtn.addEventListener('mouseleave', () => {
      magneticBtn.style.transform = 'translate(0,0)';
    });
  }
</script>

</body>
</html>
